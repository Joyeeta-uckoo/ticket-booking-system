<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Seat Booking</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; background: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; }
        input { width: calc(100% - 20px); padding: 10px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .seat { padding: 18px 0; border-radius: 8px; font-weight: bold; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .seat.available { background: #dcfce7; color: #15803d; border-color: #86efac; }
        .seat.available:hover { background: #bbf7d0; transform: translateY(-2px); }
        .seat.booked { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; cursor: not-allowed; opacity: 0.7; }
        #log { margin-top: 15px; font-size: 13px; min-height: 20px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎟️ Event Seat Reservation</h2>
        <input type="text" id="username" placeholder="Enter your name..." value="User1">
        <div class="grid" id="seat-grid"></div>
        <div id="log"></div>
    </div>

    <script>
        const grid = document.getElementById('seat-grid');
        const log = document.getElementById('log');

        async function loadSeats() {
            const res = await fetch('/api/seats');
            const seats = await res.json();
            grid.innerHTML = '';
            seats.forEach(seat => {
                const btn = document.createElement('button');
                btn.className = `seat ${seat.status.toLowerCase()}`;
                btn.textContent = seat.seat_number;
                if (seat.status === 'AVAILABLE') {
                    btn.onclick = () => bookSeat(seat.id, seat.seat_number);
                } else {
                    btn.title = `Booked by ${seat.booked_by}`;
                    btn.disabled = true;
                }
                grid.appendChild(btn);
            });
        }

        async function bookSeat(seatId, seatNumber) {
            const name = document.getElementById('username').value.trim() || 'Guest';
            log.style.color = '#64748b';
            log.textContent = `Attempting to reserve ${seatNumber}...`;

            const res = await fetch('/api/book', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ seat_id: seatId, user_name: name })
            });
            const data = await res.json();

            if (res.ok) {
                log.style.color = '#15803d';
                log.textContent = data.message;
            } else {
                log.style.color = '#b91c1c';
                log.textContent = data.error;
            }
            loadSeats();
        }

        loadSeats();
    </script>
</body>
</html>
