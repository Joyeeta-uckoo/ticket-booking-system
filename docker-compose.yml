version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ticketing_db
      MYSQL_USER: ticket_user
      MYSQL_PASSWORD: ticket_pass
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  web:
    build: .
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ticket_user
      DB_PASS: ticket_pass
      DB_NAME: ticketing_db
    ports:
      - "5050:5000"
    depends_on:
      - db

volumes:
  mysql_data:
